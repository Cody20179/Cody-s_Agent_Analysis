[project]
name = "cody-agent-analysis"
version = "0.1.0"
description = "Deployable CNC analysis pipeline with forecasting, anomaly detection, and MCP tools."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "prophet>=1.1.5",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
]

[tool.uv]
package = false
